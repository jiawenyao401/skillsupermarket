name: Generate Rankings

on:
  schedule:
    - cron: "17 * * * *"  # 每小时第 17 分钟
  workflow_dispatch:

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 生成日/周/月榜
        run: npm run rank
